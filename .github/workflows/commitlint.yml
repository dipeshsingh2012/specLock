name: Conventional Commits Lint

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, edited ]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PR Title (Pull Requests)
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.title }}" > /tmp/pr_title.txt
          python scripts/check_commit_msg.py /tmp/pr_title.txt

      - name: Validate Commit Messages (Push / PR Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git rev-list "${BASE}..${HEAD}")
          else
            # For pushes, check recent commit or commit range
            COMMITS="${{ github.sha }}"
          fi

          FAILED=0
          for COMMIT in $COMMITS; do
            MSG=$(git log -1 --format=%B "$COMMIT")
            echo "Checking commit $COMMIT:"
            echo "$MSG" > /tmp/commit_msg.txt
            if ! python scripts/check_commit_msg.py /tmp/commit_msg.txt; then
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more commits do not follow Conventional Commits specification."
            exit 1
          fi
