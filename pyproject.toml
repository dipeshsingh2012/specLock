[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speclock"
version = "0.1.0"
description = "Two-stage zero-error compatibility recommender engine combining deterministic graph pruning with neural semantic ranking."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dipesh Singh" }
]
dependencies = [
    "networkx>=3.1",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "locust>=2.24.0",
    "ruff>=0.3.0",
    "commitizen>=3.18.0",
    "pre-commit>=3.6.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
allowed_prefixes = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "perf",
    "test",
    "build",
    "ci",
    "chore",
    "revert",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing --cov-branch --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]
branch = true
data_file = "/tmp/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@runtime_checkable",
]


