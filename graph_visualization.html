    .dot-accessory { background: #10B981; }

    select, button {
      background: #334155;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    select:focus, button:hover { border-color: #38BDF8; background: #475569; }
    #container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #network {
      flex: 1;
      height: 100%;
      background: radial-gradient(#1E293B 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #0F172A;
    }
    #sidebar {
      width: 320px;
      background: #1E293B;
      border-left: 1px solid #334155;
      padding: 20px;
      overflow-y: auto;
      display: none;
      box-shadow: -4px 0 16px rgba(0,0,0,0.3);

    #sidebar h3 { font-size: 16px; margin-bottom: 8px; color: #38BDF8; }
    #sidebar .meta { font-size: 13px; margin-bottom: 12px; color: #94A3B8; }
    #sidebar pre { background: #0F172A; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; color: #A5F3FC; border: 1px solid #334155; }

    const container = document.getElementById('network');
    const data = { nodes, edges };
    const options = {
      physics: {
        barnesHut: {
          gravitationalConstant: -3500,
          centralGravity: 0.25,
          springLength: 95,
          springConstant: 0.04,
          damping: 0.09
        },
        stabilization: { iterations: 150 }
      },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        navigationButtons: true,
        keyboard: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Populate Machine Dropdown
    const select = document.getElementById('machineSelect');
    nodes.forEach(node => {
      if (node.group === 'machine') {
        const opt = document.createElement('option');
        opt.value = node.id;
        opt.textContent = node.label;
        select.appendChild(opt);
      }
    });

    // Focus on select
    select.addEventListener('change', (e) => {
      const machineId = e.target.value;
      if (!machineId) return;
      
      const connectedNodes = network.getConnectedNodes(machineId);
      const allConnected = [machineId, ...connectedNodes];
      
      // Also get 2nd degree connected accessories
      connectedNodes.forEach(specId => {
        const accessories = network.getConnectedNodes(specId);
        accessories.forEach(accId => {
          if (!allConnected.includes(accId)) allConnected.push(accId);
        });
      });

      network.fit({ nodes: allConnected, animation: true });
      network.selectNodes(allConnected);
      showSidebar(nodes.get(machineId));
    });

    // Reset view
    document.getElementById('resetBtn').addEventListener('click', () => {
      select.value = '';
      network.fit({ animation: true });
      network.unselectAll();
      document.getElementById('sidebar').style.display = 'none';
    });

    // Toggle physics
    let physicsActive = true;
    document.getElementById('physicsBtn').addEventListener('click', () => {
      physicsActive = !physicsActive;
      network.setOptions({ physics: { enabled: physicsActive } });
      document.getElementById('physicsBtn').textContent = physicsActive ? 'Pause Physics' : 'Resume Physics';
    });

    // Node click sidebar
    network.on('click', (params) => {
      if (params.nodes.length > 0) {
        const clickedNode = nodes.get(params.nodes[0]);
        showSidebar(clickedNode);
      }
    });

    function showSidebar(node) {
      if (!node) return;
      document.getElementById('sidebar').style.display = 'block';
      document.getElementById('nodeTitle').textContent = (node.label || '').replace(/\n/g, ' ');
      document.getElementById('nodeType').textContent = 'Node ID: ' + node.id + ' (' + node.group.toUpperCase() + ')';
      document.getElementById('nodeData').textContent = JSON.stringify(node.raw, null, 2);
    }

    document.getElementById('closeSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').style.display = 'none';
    });
